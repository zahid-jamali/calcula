name: Update Chile Economic Indicators

on:
  schedule:
    # Run daily at 11:00 UTC (08:00 Santiago time)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Chile indicators
        run: node scripts/update-cl-indicators.mjs

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cl-indicators.json public/data/cl-uf-history.json
          if git diff --staged --quiet; then
            echo "No changes in indicators. Skipping commit."
          else
            git commit -m "chore(data): update Chile indicators [skip ci]"
            git push
          fi
